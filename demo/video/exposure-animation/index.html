<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Mask — customer details sent to a chatbot</title>
  <style>
    :root {
      --page: #0e0e0e; --rail: #000; --line: #1f1f1f; --surface: #212121; --bubble: #262626;
      --ink: #f0f0f0; --muted: #b0b0b0; --faint: #8a8a8a; --blue: #2c68c6; --dot: #0187fc;
      --hit: rgba(255, 92, 92, .26); --hit-ink: #ffb0b0;
      /* Everything scales from the message font size, in chat-app proportions. */
      --fs: clamp(15px, 1vw, 22px);
      --rail-w: calc(var(--fs) * 3.5);
      --col: min(calc(var(--fs) * 52), calc(100vw - var(--rail-w) - 32px));
      /* Keep in step with TIMING in the script. */
      --pan: 1600ms;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--page); color: var(--ink); font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 2px solid var(--dot); outline-offset: 3px; }
    svg { display: block; }

    .camera { position: fixed; inset: 0; display: flex; transform-origin: 0 0; }
    .camera.panning { transition: transform var(--pan) cubic-bezier(.45, 0, .25, 1); }

    .rail { flex: none; width: var(--rail-w); background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: calc(var(--fs) * .25) 0 calc(var(--fs) * .8); color: var(--muted); }
    .rail svg { width: calc(var(--fs) * 1.3); height: calc(var(--fs) * 1.3); }
    .tile { position: relative; width: calc(var(--fs) * 2.5); height: calc(var(--fs) * 2.5); border-radius: calc(var(--fs) * .6); background: #1a1a1a; display: grid; place-items: center; color: var(--ink); margin-bottom: calc(var(--fs) * .4); }
    .badge { position: absolute; top: calc(var(--fs) * .2); right: calc(var(--fs) * .2); width: calc(var(--fs) * .55); height: calc(var(--fs) * .55); border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 2px #1a1a1a; }
    .ri { height: calc(var(--fs) * 3.55); display: grid; place-items: center; }
    .rule { width: calc(var(--fs) * 1.6); height: 1px; background: #2a2a2a; margin: calc(var(--fs) * .3) 0 calc(var(--fs) * .4); }
    .grow { flex: 1; }
    .avatar { width: calc(var(--fs) * 1.6); height: calc(var(--fs) * 1.6); border-radius: 50%; background: #19c37d; margin-top: calc(var(--fs) * .6); }

    .main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar { position: relative; flex: none; height: calc(var(--fs) * 3); display: flex; align-items: center; justify-content: center; }
    .toggle { display: flex; height: calc(var(--fs) * 2.4); border-radius: 999px; background: #1b1b1b; font-size: calc(var(--fs) * .95); }
    .seg { display: inline-flex; align-items: center; gap: calc(var(--fs) * .45); padding: 0 calc(var(--fs) * 2.4); border-radius: 999px; color: var(--muted); }
    .seg.on { background: var(--surface); color: var(--ink); font-weight: 500; padding: 0 calc(var(--fs) * 3); }
    .seg i { width: calc(var(--fs) * .4); height: calc(var(--fs) * .4); border-radius: 50%; background: var(--dot); }
    .top-icon { position: absolute; right: calc(var(--fs) * 1.4); top: 50%; translate: 0 -50%; color: var(--ink); }
    .top-icon svg { width: calc(var(--fs) * 1.3); height: calc(var(--fs) * 1.3); }

    .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 16px calc(var(--fs) * 6); }
    .greeting { margin: 0 0 calc(var(--fs) * 2.1); font-size: calc(var(--fs) * 1.6); font-weight: 400; letter-spacing: -.01em; color: #f5f5f5; text-align: center; }
    .thread { display: none; width: var(--col); padding-top: calc(var(--fs) * 1.2); }
    .is-thread .stage { justify-content: flex-start; padding-bottom: calc(var(--fs) * 3.4); }
    .is-thread .greeting { display: none; }
    .is-thread .thread { display: block; flex: 1; min-height: 0; }

    .turn { display: flex; align-items: center; justify-content: flex-end; gap: calc(var(--fs) * 1.6); }
    .bubble { max-width: 76%; background: var(--bubble); border-radius: calc(var(--fs) * 1.4); padding: calc(var(--fs) * .75) calc(var(--fs) * 1.2); font-size: var(--fs); line-height: 1.6; white-space: pre-wrap; overflow-wrap: break-word; }
    .pii { border-radius: 3px; transition: background 500ms, color 500ms; }
    .reveal .pii { background: var(--hit); color: var(--hit-ink); transition-delay: calc(var(--i) * var(--stagger)); }
    .exposed { flex: 1; min-width: 0; text-align: right; font-size: calc(var(--fs) * .9); line-height: 1.5; color: var(--muted); opacity: 0; transform: translateX(-10px); transition: opacity 700ms, transform 700ms; }
    .exposed.show { opacity: 1; transform: none; }
    .exposed p { margin: 0 0 calc(var(--fs) * .35); color: var(--faint); font-size: calc(var(--fs) * .8); text-transform: uppercase; letter-spacing: .06em; }
    .exposed ul { list-style: none; margin: 0; padding: 0; }
    .exposed b { color: var(--hit-ink); font-weight: 600; }
    .thinking { display: block; width: calc(var(--fs) * .85); height: calc(var(--fs) * .85); margin-top: calc(var(--fs) * 1.6); border-radius: 50%; background: var(--ink); opacity: 0; }
    .is-thread .thinking.on { animation: breathe 1.4s ease-in-out infinite; }
    .zoomed .thinking.on { animation: none; opacity: 0; transition: opacity var(--pan); }
    @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

    .composer { position: relative; z-index: 2; flex: none; width: var(--col); background: var(--surface); border-radius: calc(var(--fs) * 1.8); box-shadow: inset 0 0 0 1px #2b2b2b; }
    .composer { transition: opacity var(--pan); }
    .zoomed .composer { opacity: 0; }
    .is-thread .composer::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: calc(var(--fs) * 1.6); background: linear-gradient(transparent, var(--page)); pointer-events: none; }
    .field { padding: calc(var(--fs) * 1.1) calc(var(--fs) * 3.4) 0 calc(var(--fs) * 1.2); font-size: var(--fs); line-height: 1.75; white-space: pre-wrap; overflow-wrap: break-word; }
    .is-home .field { max-height: calc(var(--fs) * 1.75 * 8 + var(--fs) * 1.1); overflow: hidden; -webkit-mask-image: linear-gradient(#000 calc(100% - var(--fs) * 1.75), rgba(0, 0, 0, .45)); mask-image: linear-gradient(#000 calc(100% - var(--fs) * 1.75), rgba(0, 0, 0, .45)); }
    .field:empty::before { content: "Ask anything"; color: var(--faint); }
    .expand { position: absolute; top: calc(var(--fs) * 1.2); right: calc(var(--fs) * 1.2); color: var(--ink); }
    .is-thread .expand { display: none; }
    .expand svg { width: calc(var(--fs) * 1.05); height: calc(var(--fs) * 1.05); }
    .toolbar { display: flex; align-items: center; gap: calc(var(--fs) * .6); padding: calc(var(--fs) * .5) calc(var(--fs) * .5) calc(var(--fs) * .5) calc(var(--fs) * .5); color: var(--ink); }
    .tb { width: calc(var(--fs) * 2.4); height: calc(var(--fs) * 2.4); display: grid; place-items: center; }
    .tb svg { width: calc(var(--fs) * 1.3); height: calc(var(--fs) * 1.3); }
    .effort { display: inline-flex; align-items: center; gap: calc(var(--fs) * .4); color: var(--muted); font-size: var(--fs); }
    .effort svg { width: calc(var(--fs) * .8); height: calc(var(--fs) * .8); }
    .send { width: calc(var(--fs) * 2.4); height: calc(var(--fs) * 2.4); border: 0; border-radius: 50%; padding: 0; display: grid; place-items: center; background: var(--blue); color: #fff; cursor: pointer; }
    .send svg { width: calc(var(--fs) * 1.25); height: calc(var(--fs) * 1.25); }
    .send .stop { display: none; }
    .is-thread .send { background: var(--ink); color: var(--page); cursor: default; }
    .is-thread .send .arrow { display: none; }
    .is-thread .send .stop { display: block; width: calc(var(--fs) * .8); height: calc(var(--fs) * .8); }

    .caption { position: fixed; left: 0; right: 0; bottom: calc(var(--fs) * .55); margin: 0; padding-left: var(--rail-w); text-align: center; font-size: calc(var(--fs) * .75); color: var(--muted); pointer-events: none; }
    .footer { position: fixed; inset: auto 0 0 var(--rail-w); padding: 0 24px calc(var(--fs) * .4); display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; font-size: 12px; color: #5e5e5e; transition: opacity 180ms; }
    .controls { display: flex; gap: 17px; align-items: center; }
    .controls button { color: #6e6e6e; border: 0; background: none; padding: 7px 3px; cursor: pointer; }
    .controls button:hover { color: var(--ink); }
    .controls button:disabled { cursor: default; opacity: .3; }
    .key-help { font-size: 11px; }
    .hide-controls .footer { opacity: 0; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 1100px) { .key-help { display: none; } }
    @media (max-width: 700px) {
      :root { --rail-w: 0px; }
      .rail, .top-icon { display: none; }
      .bubble { max-width: 100%; }
      .turn { flex-direction: column-reverse; align-items: flex-end; }
      .exposed { text-align: left; }
      .step-label { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="camera is-home" id="camera">
    <nav class="rail" aria-hidden="true">
      <span class="tile"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M3.5 9 10 3.5 16.5 9v7a1 1 0 0 1-1 1H12v-4.5H8V17H4.5a1 1 0 0 1-1-1V9Z"/></svg><i class="badge"></i></span>
      <span class="ri"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="6.5" y="6.5" width="10" height="10" rx="2"/><path d="M13.5 6.5V5A1.5 1.5 0 0 0 12 3.5H5A1.5 1.5 0 0 0 3.5 5v7A1.5 1.5 0 0 0 5 13.5h1.5"/></svg></span>
      <span class="ri"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l-2.2 2.2"/></svg></span>
      <span class="ri"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M16.5 10a6.5 6.5 0 1 0-2.6 5.2"/><circle cx="10" cy="10" r="2.6"/><path d="M12.6 8.5V11a1.9 1.9 0 0 0 3.9 0v-1"/></svg></span>
      <span class="ri"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="4.5" cy="10" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="15.5" cy="10" r="1.4"/></svg></span>
      <span class="rule"></span>
      <span class="ri"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="3.5" width="5" height="5" rx="1.2"/><rect x="11.5" y="3.5" width="5" height="5" rx="1.2"/><rect x="3.5" y="11.5" width="5" height="5" rx="1.2"/><rect x="11.5" y="11.5" width="5" height="5" rx="1.2"/></svg></span>
      <span class="grow"></span>
      <span class="ri"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7.5"/><path d="M10 7.2 12.8 10 10 12.8 7.2 10Z" fill="currentColor"/></svg></span>
      <span class="avatar"></span>
    </nav>
    <div class="main">
      <header class="topbar" aria-hidden="true">
        <div class="toggle"><span class="seg on">Chat</span><span class="seg"><i></i>Work</span></div>
        <span class="top-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5a6.5 6.5 0 1 1-5.5 10l-1 3 3.1-.9"/></svg></span>
      </header>
      <div class="stage">
        <h1 class="greeting" id="greeting">Hey, Chark. Ready to dive in?</h1>
        <section class="thread" aria-label="Conversation">
          <div class="turn" id="turn">
            <aside class="exposed" id="exposed" aria-label="Customer details sent">
              <p>Sent to the AI</p>
              <ul id="counts"></ul>
            </aside>
            <div class="bubble" id="bubble"></div>
          </div>
          <span class="thinking" id="thinking" aria-hidden="true"></span>
        </section>
        <div class="composer" id="composer">
          <div class="field" id="field"></div>
          <span class="expand" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5h4.5V8M16.5 3.5l-5 5M8 16.5H3.5V12M3.5 16.5l5-5"/></svg></span>
          <div class="toolbar">
            <span class="tb" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 3.5v13M3.5 10h13"/></svg></span>
            <span class="grow"></span>
            <span class="effort" aria-hidden="true">Medium <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7.5 5 5 5-5"/></svg></span>
            <span class="tb" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="7.25" y="2.75" width="5.5" height="9.5" rx="2.75"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg></span>
            <button class="send" id="send" type="button" aria-label="Send message">
              <svg class="arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15.5V4.5M5 9.5l5-5 5 5"/></svg>
              <svg class="stop" viewBox="0 0 10 10" fill="currentColor"><rect width="10" height="10" rx="1.5"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p class="caption">Staged example · fictional customer data</p>
  <footer class="footer">
    <div class="step-label">1 / 2 · Message ready</div>
    <nav class="controls" aria-label="Animation controls">
      <span class="key-help">Space / Enter / click send · ← back · R restart · H hide controls</span>
      <button id="back" type="button" aria-label="Previous step" disabled>←</button>
      <button id="next" type="button" aria-label="Next step">→</button>
      <button id="fullscreen" type="button" aria-label="Toggle fullscreen">Fullscreen</button>
    </nav>
  </footer>
  <div class="sr-only" role="status" aria-live="polite" id="announcement"></div>
  <script>
    (() => {
      'use strict';
      // Fictional data. Nothing is sent anywhere; this page only replays the moment of sending.
      const MESSAGE = `What are the three main things our customers are complaining about in these support tickets? Count the tickets in each category and suggest one practical improvement for each.

Here’s the export from our support system:

customer_name,customer_id,email,complaint
Emma Wilson,C-1042,emma.wilson@example.com,"I was charged twice for the same order. Please refund the extra payment."
Oliver Davis,C-2087,oliver.davis@example.com,"I returned my order two weeks ago and still haven’t received my refund. Please send an update to oliver.davis@example.com."
Sofia Martin,C-3156,sofia.martin@example.com,"The password-reset email never arrives, so I can’t get into my account."
Noah Taylor,C-4093,noah.taylor@example.com,"My payment failed on screen, so I tried again. Now I can see two charges for one order."
Amelia Brown,C-5028,amelia.brown@example.com,"Support confirmed my refund ten days ago, but the money still hasn’t arrived."
Lucas Harris,C-6074,lucas.harris@example.com,"Hi, Lucas Harris here. I’ve been billed twice for a single purchase and need the duplicate charge reversed."`;
      const DETAILS = /\b(?:Emma Wilson|Oliver Davis|Sofia Martin|Noah Taylor|Amelia Brown|Lucas Harris)\b|\bC-\d{4}\b|\b[a-z]+\.[a-z]+@example\.com\b/g;
      const KINDS = [
        { key: 'name', label: 'names' },
        { key: 'id', label: 'customer IDs' },
        { key: 'email', label: 'email addresses' }
      ];
      // Milliseconds. pan matches --pan in the CSS.
      const TIMING = { press: 160, move: 600, beforePan: 700, pan: 1600, beforeHighlight: 300, stagger: 140, highlight: 500, beforeCounts: 500 };
      const MAX_ZOOM = 1.5;
      const labels = ['Message ready', 'Sent to the AI'];

      const camera = document.getElementById('camera');
      const field = document.getElementById('field');
      const composer = document.getElementById('composer');
      const bubble = document.getElementById('bubble');
      const turn = document.getElementById('turn');
      const exposed = document.getElementById('exposed');
      const thinking = document.getElementById('thinking');
      const send = document.getElementById('send');
      const back = document.getElementById('back');
      const next = document.getElementById('next');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const delay = ms => new Promise(resolve => setTimeout(resolve, reduceMotion.matches ? 0 : ms));
      let step = 0;
      let run = 0;

      // Build the sent bubble once, with every exposed detail wrapped for highlighting.
      const seen = { name: new Set(), id: new Set(), email: new Set() };
      let last = 0;
      let index = 0;
      for (const match of MESSAGE.matchAll(DETAILS)) {
        const value = match[0];
        const kind = value.includes('@') ? 'email' : /^C-\d{4}$/.test(value) ? 'id' : 'name';
        seen[kind].add(value);
        bubble.append(MESSAGE.slice(last, match.index));
        const span = document.createElement('span');
        span.className = 'pii';
        span.dataset.kind = kind;
        span.style.setProperty('--i', index++);
        span.textContent = value;
        bubble.append(span);
        last = match.index + value.length;
      }
      bubble.append(MESSAGE.slice(last));
      bubble.style.setProperty('--stagger', `${TIMING.stagger}ms`);
      document.getElementById('counts').replaceChildren(...KINDS.map(({ key, label }) => {
        const item = document.createElement('li');
        const count = document.createElement('b');
        count.textContent = seen[key].size;
        item.append(count, ` ${label}`);
        return item;
      }));
      const highlightTime = (index - 1) * TIMING.stagger + TIMING.highlight;

      function setCamera(transform, animate) {
        camera.classList.toggle('panning', animate && !reduceMotion.matches);
        camera.classList.toggle('zoomed', transform !== 'none');
        camera.style.transform = transform;
      }
      // Centre and enlarge the sent message. Measured with the camera at rest.
      function framing() {
        const previous = camera.style.transform;
        camera.style.transform = 'none';
        const box = turn.getBoundingClientRect();
        camera.style.transform = previous;
        const scale = Math.max(1, Math.min(MAX_ZOOM, (innerHeight * .86) / box.height, (innerWidth * .94) / box.width));
        const x = innerWidth / 2 - scale * (box.left + box.width / 2);
        const y = innerHeight / 2 - scale * (box.top + box.height / 2);
        return `translate(${x}px, ${y}px) scale(${scale})`;
      }
      function showHome() {
        run++;
        setCamera('none', false);
        camera.classList.replace('is-thread', 'is-home');
        field.textContent = MESSAGE;
        bubble.classList.remove('reveal');
        exposed.classList.remove('show');
        thinking.classList.remove('on');
        send.disabled = false;
      }
      function showSent() {
        run++;
        camera.classList.replace('is-home', 'is-thread');
        field.textContent = '';
        send.disabled = true;
        thinking.classList.add('on');
        bubble.classList.add('reveal');
        exposed.classList.add('show');
        setCamera(framing(), false);
      }
      async function sendMessage() {
        const current = ++run;
        const still = () => current === run;
        send.disabled = true;
        if (!reduceMotion.matches) {
          send.animate([{ transform: 'scale(1)' }, { transform: 'scale(.86)' }, { transform: 'scale(1)' }], { duration: TIMING.press, easing: 'ease-out' });
        }
        await delay(TIMING.press);
        if (!still()) return;
        const before = composer.getBoundingClientRect();
        camera.classList.replace('is-home', 'is-thread');
        field.textContent = '';
        if (!reduceMotion.matches) {
          const after = composer.getBoundingClientRect();
          composer.animate([{ transform: `translateY(${before.bottom - after.bottom}px)` }, { transform: 'none' }], { duration: TIMING.move, easing: 'cubic-bezier(.22, 1, .36, 1)' });
          bubble.animate([{ opacity: 0, transform: 'translateY(28px)' }, { opacity: 1, transform: 'none' }], { duration: TIMING.move, easing: 'cubic-bezier(.22, 1, .36, 1)' });
        }
        await delay(TIMING.move / 2);
        if (!still()) return;
        thinking.classList.add('on');
        await delay(TIMING.move / 2 + TIMING.beforePan);
        if (!still()) return;
        setCamera(framing(), true);
        await delay(TIMING.pan + TIMING.beforeHighlight);
        if (!still()) return;
        bubble.classList.add('reveal');
        await delay(highlightTime + TIMING.beforeCounts);
        if (!still()) return;
        exposed.classList.add('show');
      }

      function updateControls() {
        back.disabled = step === 0;
        next.disabled = step === labels.length - 1;
        document.querySelector('.step-label').textContent = `${step + 1} / ${labels.length} · ${labels[step]}`;
        document.getElementById('announcement').textContent = labels[step];
      }
      function go(target) {
        if (target < 0 || target >= labels.length || target === step) return;
        const forward = target === step + 1;
        step = target;
        updateControls();
        if (step === 0) showHome();
        else if (forward) sendMessage();
        else showSent();
      }
      async function fullscreen() {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        } catch (_) { document.getElementById('announcement').textContent = 'Use your browser’s fullscreen command.'; }
      }

      // Optional #2 in the URL opens directly on the sent, highlighted view.
      showHome();
      if (location.hash === '#2') { step = 1; showSent(); }
      updateControls();

      send.addEventListener('click', () => go(1));
      back.addEventListener('click', () => go(step - 1));
      next.addEventListener('click', () => go(step + 1));
      document.getElementById('fullscreen').addEventListener('click', fullscreen);
      window.addEventListener('resize', () => { if (step === 1) setCamera(framing(), false); });
      window.addEventListener('keydown', event => {
        if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key === ' ' || event.key === 'ArrowRight' || event.key === 'Enter') {
          event.preventDefault(); go(step + (event.shiftKey ? -1 : 1));
        } else if (event.key === 'ArrowLeft') {
          event.preventDefault(); go(step - 1);
        } else if (event.key.toLowerCase() === 'r' || event.key === 'Home') {
          event.preventDefault(); go(0);
        } else if (event.key.toLowerCase() === 'h') {
          event.preventDefault();
          const hidden = document.body.classList.toggle('hide-controls');
          document.querySelector('.controls').inert = hidden;
        } else if (event.key.toLowerCase() === 'f') {
          event.preventDefault(); fullscreen();
        }
      });
    })();
  </script>
</body>
</html>
