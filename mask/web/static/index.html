<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Mask</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="/font.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main id="workspace" class="inline-mode">
      <div class="mode-switch" role="group" aria-label="Layout"><button id="mode-inline" type="button" aria-pressed="true">Inline</button><span aria-hidden="true">/</span><button id="mode-compare" type="button" aria-pressed="false">Compare</button></div>
      <input id="task" class="purpose" aria-label="Intended use (optional)" placeholder="Intended use (optional)" maxlength="4000" autocomplete="off" spellcheck="false" />
      <div class="panels" id="panels">
        <section class="panel original-panel" aria-label="Your message">
          <textarea id="message" aria-label="Your message" placeholder="Your message" maxlength="4000" spellcheck="false" autocomplete="off"></textarea>
          <div id="inline-output" class="text-surface" role="textbox" aria-label="Filtered message" aria-readonly="true" tabindex="0" hidden></div>
          <div class="filter-bar"><button id="edit" type="button" hidden>Edit</button><button id="filter" type="button" disabled><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 4h14l-5.5 6.2V16l-3-1.5v-4.3L3 4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span id="filter-label">Filter</span></button><span id="inline-count"></span><button id="inspect-inline" type="button" hidden>Request ↗</button></div>
        </section>
        <section class="panel protected-panel" aria-label="Protected message">
          <div id="output" class="text-surface" role="textbox" aria-label="What the AI gets" aria-readonly="true" aria-describedby="status" tabindex="0" data-placeholder="What the AI gets"></div>
          <div class="panel-bottom"><span id="change-count"></span><button id="inspect" type="button" title="See the exact request to Claude" aria-pressed="false" hidden>Request ↗</button></div>
        </section>
        <div class="send-slot"><button id="send" type="button" aria-label="Send protected message to Claude" title="Send this reviewed preview to Claude" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="flight" aria-hidden="true"></span></div>
        <section id="reply-panel" class="panel reply-panel" aria-label="Claude reply" hidden>
          <div id="reply" class="text-surface" role="region" aria-label="Claude response" tabindex="0" data-placeholder="Claude is replying…"></div>
          <div class="panel-bottom"><span id="reply-status">Claude</span><button id="names" type="button" title="Restore known person placeholders on this device" aria-pressed="false" hidden>Restore names</button><button id="stop" type="button" aria-label="Stop reply" hidden>Stop ■</button></div>
        </section>
      </div>
      <div class="status-row"><p id="status" role="status" aria-live="polite"></p><button id="retry" type="button" hidden>Try again ↻</button></div>
    </main>
  </body>
</html>
