<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Mask</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main>
    <div class="toolbar"><button id="theme" type="button" aria-label="Switch to light mode" title="Switch to light mode"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button><button id="example" type="button" title="Load the medical example; click again for support tickets">try an example</button></div>
    <div class="box">
      <textarea id="message" aria-label="Your message" placeholder="Your message" maxlength="4000" spellcheck="false" autocomplete="off"></textarea>
      <div id="output" role="textbox" aria-label="Filtered message" aria-readonly="true" tabindex="0" hidden></div>
    </div>
    <div class="actions"><button id="filter" class="action-button" type="button" disabled>Filter</button><button id="send" type="button" aria-label="Send to Claude" title="Send this protected message to Claude" hidden><span>Send to Claude</span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <p id="send-note" hidden>Only the filtered message is sent.</p>
    <section id="reply-section" aria-label="Chatbot reply" hidden>
      <p id="reply-label">Claude’s reply</p>
      <div class="box"><div id="reply" role="region" aria-label="Chatbot response" tabindex="0"></div></div>
      <button id="revert" class="action-button" type="button" disabled>Restore names on this device</button>
    </section>
  </main>
</body>
</html>
