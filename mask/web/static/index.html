<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Mask</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="/font.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <label class="purpose" for="task">
        <span>Intended use <span class="optional">(optional)</span></span>
        <input id="task" type="text" placeholder="What do you want the AI to do?" maxlength="4000" autocomplete="off" spellcheck="false" aria-describedby="purpose-hint" />
        <small id="purpose-hint">Leave blank if your message already includes the request.</small>
      </label>
      <textarea id="message" aria-label="Your message" placeholder="Your message" maxlength="4000" spellcheck="false" autocomplete="off"></textarea>
      <div class="result">
        <textarea id="output" aria-label="What the AI gets" aria-describedby="status" placeholder="What the AI gets" readonly spellcheck="false"></textarea>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </main>
  </body>
</html>
