[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://storage.googleapis.com https://mask-demo-relay-439502948711.europe-north1.run.app; style-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/pipeline.worker-*.js"
  [headers.values]
    # Pyodide's Emscripten bridge evaluates its own generated JS inside the
    # isolated worker. The page itself keeps the stricter CSP above.
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://storage.googleapis.com"

[[headers]]
  for = "/app-config.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/models/*.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/runtime/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/tokenizer/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/policy/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
