[package]
name = "mask-tokenizer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
tokenizers = { version = "=0.22.2", default-features = false, features = ["unstable_wasm"] }
wasm-bindgen = "=0.2.108"
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"

